<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Gemini CRM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/app.css">
</head>
<body data-page="dashboard">
  <button class="sidebar-toggle" type="button" aria-label="Abrir menu">&#9776;</button>
  <div class="sidebar-overlay"></div>
  <aside data-sidebar></aside>
  <main>
    <div class="dashboard-view">
      <h1 style="font-size: 1.5rem; font-weight: 700;">Dashboard General</h1>
      <div class="stats-grid">
        <div class="stat-card">
          <h3>Total Clientes</h3>
          <div class="value" id="stat-total-clients">0</div>
        </div>
        <div class="stat-card">
          <h3>Tarjetas Activas</h3>
          <div class="value" id="stat-active-cards">0</div>
        </div>
        <div class="stat-card">
          <h3>Tareas Vencidas</h3>
          <div class="value" id="stat-expired-cards" style="color: var(--due-expired-text);">0</div>
        </div>
      </div>
      <section class="clients-section">
        <div class="section-header">
          <h2 style="font-size: 1.1rem; font-weight: 600;">Gestion de Clientes</h2>
          <button class="btn" type="button" data-open-client>Agregar Cliente</button>
        </div>
        <div class="table-wrap">
        <table class="table">
          <thead>
            <tr>
              <th class="sortable-th" data-sort="name">Nombre <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="company">Empresa <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="email">Correo <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="links">Links <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="owner">Personal a cargo <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="status">Estado <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="complexity">Complejidad <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="adStatus">Publicidad <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="meeting">Reunion <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="cards">Tarjetas Asignadas <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="timedCards">Con Timer <span class="sort-icon"></span></th>
              <th class="sortable-th" data-sort="avgTime">Promedio en Timer <span class="sort-icon"></span></th>
              <th></th>
            </tr>
          </thead>
          <tbody id="clients-table-body"></tbody>
        </table>
        </div>
      </section>
      <section class="general-links-section">
        <div class="section-header">
          <h2 style="font-size: 1.1rem; font-weight: 600;">Links Generales</h2>
          <button class="btn" type="button" data-add-general-link>Agregar Link</button>
        </div>
        <div id="general-links-list" class="general-links-grid"></div>
      </section>
    </div>
  </main>
  <div id="modal-root"></div>
  <script type="module" src="/scripts/dashboard.js"></script>
</body>
</html>
