<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | WIM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
  <section class="login-screen">
    <form class="login-box" id="login-form">
      <h2 class="brand-title">WIM</h2>
      <p class="login-copy">Inicia sesion con tus credenciales</p>
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" class="form-control" autocomplete="email">
      </div>
      <div class="form-group">
        <label for="login-password">Contrasena</label>
        <div class="password-field">
          <input type="password" id="login-password" class="form-control" autocomplete="current-password">
          <button class="password-toggle" type="button" data-toggle-password aria-label="Mostrar contrasena" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button class="btn" type="submit" style="width: 100%; margin-top: 10px;">Ingresar</button>
      <p class="error-message" id="login-error"></p>
    </form>
  </section>
  <script type="module" src="/scripts/login.js"></script>
</body>
</html>
